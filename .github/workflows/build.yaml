name: build

# Self-hosted build-and-deploy on push:
#   GitHub queues the job → ARC scales a tir-k3s runner on k3s (aaron-box) →
#   the job builds with in-cluster rootless BuildKit, pushes to registry:2, then bumps
#   the image tag in tir-gitops → ArgoCD reconciles the new image onto the cluster.
# No image and no cluster credential ever leave the box.
on:
  push:
    branches: [webApp]
  workflow_dispatch:

jobs:
  build:
    runs-on: tir-k3s
    # containerMode=kubernetes forbids container-less jobs. Use a glibc image so the
    # runner-injected node (for actions/*) works; install the few tools we need.
    container:
      image: debian:bookworm-slim
    steps:
      - name: Install tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends curl ca-certificates tar git openssh-client

      - uses: actions/checkout@v4

      - name: Install buildctl
        run: |
          VERSION=0.18.0
          curl -fsSL "https://github.com/moby/buildkit/releases/download/v${VERSION}/buildkit-v${VERSION}.linux-amd64.tar.gz" \
            | tar -xz -C /usr/local bin/buildctl
          buildctl --version

      - name: Build and push image
        env:
          REG: registry.registry.svc:5000/kalshi
        run: |
          buildctl --addr tcp://buildkitd.arc-runners.svc:1234 build \
            --frontend dockerfile.v0 \
            --local context=. \
            --local dockerfile=. \
            --output "type=image,\"name=${REG}:${GITHUB_SHA},${REG}:latest\",push=true"

      - name: Deploy — bump image tag in tir-gitops
        env:
          GITOPS_DEPLOY_KEY: ${{ secrets.GITOPS_DEPLOY_KEY }}
        run: |
          printf '%s\n' "$GITOPS_DEPLOY_KEY" > /tmp/ci_key
          chmod 600 /tmp/ci_key
          export GIT_SSH_COMMAND="ssh -i /tmp/ci_key -o StrictHostKeyChecking=accept-new -o IdentitiesOnly=yes"
          git clone --depth 1 git@github.com:evilaaron11/tir-gitops.git /tmp/gitops
          cd /tmp/gitops
          sed -i "s#image: registry.registry.svc:5000/kalshi:.*#image: registry.registry.svc:5000/kalshi:${GITHUB_SHA}#" apps/kalshi/deployment.yaml
          git config user.name  "tir-ci"
          git config user.email "ci@tir.local"
          if git diff --quiet; then
            echo "image tag already current, nothing to commit"
          else
            git commit -am "deploy: kalshi ${GITHUB_SHA}"
            git push origin HEAD:main
          fi
