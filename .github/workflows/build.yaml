name: build

# Self-hosted build-on-push: GitHub queues the job, the ARC controller scales up a
# runner pod on tir-k3s (k3s on aaron-box), which builds the image with the in-cluster
# rootless BuildKit and pushes it to the in-cluster registry. No image leaves the box.
on:
  push:
    branches: [webApp]
  workflow_dispatch:

jobs:
  build:
    runs-on: tir-k3s
    steps:
      - uses: actions/checkout@v4

      - name: Install buildctl
        run: |
          VERSION=0.18.0
          curl -fsSL "https://github.com/moby/buildkit/releases/download/v${VERSION}/buildkit-v${VERSION}.linux-amd64.tar.gz" \
            | tar -xz -C /tmp bin/buildctl
          echo /tmp/bin >> "$GITHUB_PATH"

      - name: Build and push image
        env:
          REG: registry.registry.svc:5000/kalshi
        run: |
          buildctl --addr tcp://buildkitd.arc-runners.svc:1234 build \
            --frontend dockerfile.v0 \
            --local context=. \
            --local dockerfile=. \
            --output "type=image,\"name=${REG}:${GITHUB_SHA},${REG}:latest\",push=true"
